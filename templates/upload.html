<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>AI Water Saver</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

<style>
body{
    min-height:100vh;
    margin:0;
    font-family: system-ui;
    background: linear-gradient(135deg,#e0f2fe,#bbf7d0);
}

.wrapper{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
}

.card-main{
    width:100%;
    max-width:900px;
    background:white;
    border-radius:20px;
    box-shadow:0 25px 60px rgba(0,0,0,0.08);
    padding:40px;
}

.title{
    font-weight:800;
    font-size:26px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
}

.upload-box{
    border:2px dashed #94a3b8;
    border-radius:16px;
    padding:30px;
    text-align:center;
    cursor:pointer;
    transition:0.3s;
}

.upload-box:hover{
    border-color:#0ea5e9;
    background:#f8fafc;
}

.btn-main{
    border-radius:999px;
    padding:10px 25px;
    border:none;
    font-weight:600;
    background:linear-gradient(135deg,#0ea5e9,#22c55e);
    color:white;
}

.btn-main:hover{
    opacity:0.9;
}
</style>
</head>
<body>

<div class="wrapper">
<div class="card-main">

    <div class="mb-4 text-center">
        <h2 class="title">منصة ذكية لتحليل استهلاك الماء في غسل اليدين</h2>
        <p class="subtitle">
            ارفع فيديو قصير وسيتم تحليل زمن الاستخدام ومدة الهدر وكمية المياه المستهلكة.
        </p>
    </div>

    {% if error %}
    <div class="alert alert-danger text-center">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        <label class="upload-box mb-4 w-100">
            <div class="mb-2">⬆️ اسحب وأسقطي الفيديو هنا أو اضغط للاختيار</div>
            <small class="text-muted">mp4 / mov / avi / mkv</small>
            <input type="file" name="file" accept="video/*" required hidden>
        </label>

        <div class="text-center">
            <button type="submit" class="btn btn-main">
                تحليل استهلاك الماء
            </button>
        </div>
    </form>

</div>
</div>

</body>
</html>
